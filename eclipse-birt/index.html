<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>corp.local &middot; Internal Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 720px;
            padding: 60px 40px;
            text-align: center;
        }
        .logo {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 16px;
        }
        h1 strong { font-weight: 700; }
        .tagline {
            font-size: 18px;
            opacity: 0.85;
        }
        footer {
            position: fixed;
            bottom: 16px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">corp.local</div>
        <h1>Welcome to the <strong>Corp.Local</strong> Portal</h1>
        <p class="tagline">Internal services portal</p>
    </div>
    <footer>For authorized personnel only &middot; corp.local IT services</footer>
</body>
</html>
